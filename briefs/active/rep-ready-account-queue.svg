<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern></defs>
  <rect width="1080" height="1350" fill="#0F1217"/><rect width="1080" height="1350" fill="url(#grid)"/>
  <path d="M40 20H1040M40 1330H1040" stroke="#404754"/>
  <text x="56" y="74" fill="#E11E48" font-family="JetBrains Mono" font-size="20" font-weight="600" letter-spacing="1.2">SALES CAPACITY / SAME HEADCOUNT</text>
  <text x="56" y="161" fill="#E5E9F0" font-family="Sofia Sans" font-size="75" font-weight="700" >Give reps back their</text>
  <text x="56" y="242" fill="#E11E48" font-family="Sofia Sans" font-size="79" font-weight="700" font-style="italic">selling hours.</text>
  <text x="56" y="286" fill="#A0A8B5" font-family="Sofia Sans" font-size="25" font-weight="400" >A five-step switch from manual lists to rep-ready accounts.</text>
  <rect x="56" y="318" width="461" height="181" rx="9" fill="#181C23" stroke="#404754"/>
  <path d="M56 318V499" stroke="#E11E48" stroke-width="5"/>
  <text x="82" y="356" fill="#E11E48" font-family="JetBrains Mono" font-size="18" font-weight="600" letter-spacing="1">REP WORK TODAY</text>
  <text x="82" y="405" fill="#E5E9F0" font-family="Sofia Sans" font-size="28" font-weight="700" >Find prospects</text>
  <text x="82" y="445" fill="#A0A8B5" font-family="Sofia Sans" font-size="24" font-weight="400" >Enrich records  →  Clean CRM</text>
  <rect x="539" y="318" width="485" height="181" rx="9" fill="#181C23" stroke="#404754"/>
  <path d="M539 318V499" stroke="#6FA8DC" stroke-width="5"/>
  <text x="565" y="356" fill="#6FA8DC" font-family="JetBrains Mono" font-size="18" font-weight="600" letter-spacing="1">REP WORK WITH A SYSTEM</text>
  <text x="565" y="405" fill="#E5E9F0" font-family="Sofia Sans" font-size="28" font-weight="700" >Work qualified accounts</text>
  <text x="565" y="445" fill="#A0A8B5" font-family="Sofia Sans" font-size="23" font-weight="400" >Context  →  Outreach  →  Meetings</text>
  <path d="M86 539V1171" stroke="#404754" stroke-width="3"/>
  <path d="M86 539V1126" stroke="#6FA8DC" stroke-width="3"/>
  <g opacity="1">
    <rect x="141" y="565" width="883" height="105" rx="9" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="59" y="592" width="54" height="50" rx="7" fill="#232830" stroke="#404754"/>
    <text x="86" y="625" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">01</text>
    <text x="168" y="608" fill="#E5E9F0" font-family="Sofia Sans" font-size="30" font-weight="700" >Audit list-building hours</text>
    <text x="168" y="644" fill="#A0A8B5" font-family="Sofia Sans" font-size="23" font-weight="400" >Count research, enrichment, and CRM cleanup time.</text>
  </g><g opacity="1">
    <rect x="141" y="686" width="883" height="105" rx="9" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="59" y="713" width="54" height="50" rx="7" fill="#232830" stroke="#404754"/>
    <text x="86" y="746" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">02</text>
    <text x="168" y="729" fill="#E5E9F0" font-family="Sofia Sans" font-size="30" font-weight="700" >Define a qualified account</text>
    <text x="168" y="765" fill="#A0A8B5" font-family="Sofia Sans" font-size="23" font-weight="400" >Set fit, signal, and contact rules before routing.</text>
  </g><g opacity="1">
    <rect x="141" y="807" width="883" height="105" rx="9" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="59" y="834" width="54" height="50" rx="7" fill="#232830" stroke="#404754"/>
    <text x="86" y="867" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">03</text>
    <text x="168" y="850" fill="#E5E9F0" font-family="Sofia Sans" font-size="30" font-weight="700" >Build one live account queue</text>
    <text x="168" y="886" fill="#A0A8B5" font-family="Sofia Sans" font-size="23" font-weight="400" >Source, enrich, and deduplicate continuously.</text>
  </g><g opacity="1">
    <rect x="141" y="928" width="883" height="105" rx="9" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="59" y="955" width="54" height="50" rx="7" fill="#232830" stroke="#404754"/>
    <text x="86" y="988" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">04</text>
    <text x="168" y="971" fill="#E5E9F0" font-family="Sofia Sans" font-size="30" font-weight="700" >Give reps a reason to act</text>
    <text x="168" y="1007" fill="#A0A8B5" font-family="Sofia Sans" font-size="23" font-weight="400" >Include the signal, account summary, and next step.</text>
  </g><g opacity="1">
    <rect x="141" y="1049" width="883" height="105" rx="9" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="59" y="1076" width="54" height="50" rx="7" fill="#232830" stroke="#404754"/>
    <text x="86" y="1109" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">05</text>
    <text x="168" y="1092" fill="#E5E9F0" font-family="Sofia Sans" font-size="30" font-weight="700" >Improve the queue each round</text>
    <text x="168" y="1128" fill="#A0A8B5" font-family="Sofia Sans" font-size="23" font-weight="400" >Feed replies and meetings back into the rules.</text>
  </g>
  <path d="M56 1191H1024" stroke="#404754" stroke-width="2"/>
  <text x="56" y="1235" fill="#E5E9F0" font-family="Sofia Sans" font-size="26" font-weight="500" >The list should improve while reps sell.</text>
  <text x="56" y="1274" fill="#A0A8B5" font-family="Sofia Sans" font-size="22" font-weight="400" >Start with step 1: measure the hours your reps spend sourcing.</text>
