  <path d="M40 20H1040M40 1330H1040" stroke="#404754"/>
  <text x="56" y="75" fill="#E11E48" font-family="JetBrains Mono" font-size="21" font-weight="600" letter-spacing="1.2">1,163 POSTS / 27 GTM CREATORS</text>
  <text x="56" y="169" fill="#E5E9F0" font-family="Sofia Sans" font-size="80" font-weight="700" >From post to</text>
  <text x="56" y="250" fill="#E11E48" font-family="Sofia Sans" font-size="82" font-weight="700" font-style="italic">pipeline.</text>
  <text x="56" y="299" fill="#A0A8B5" font-family="Sofia Sans" font-size="25" font-weight="400" >The six moves that turn content into conversations.</text>
  <rect x="667" y="113" width="356" height="155" rx="9" fill="#181C23" stroke="#404754"/>
  <path d="M667 113V268" stroke="#E11E48" stroke-width="5"/>
  <text x="692" y="150" fill="#E11E48" font-family="JetBrains Mono" font-size="18" font-weight="600" letter-spacing="1">REAL RESULT</text>
  <text x="692" y="195" fill="#E5E9F0" font-family="Sofia Sans" font-size="31" font-weight="700" >Ekipa → Caritas</text>
  <text x="692" y="232" fill="#A0A8B5" font-family="Sofia Sans" font-size="22" font-weight="400" >Pilot after one post</text>
  <path d="M87 305V1202" stroke="#404754" stroke-width="3"/>
  <path d="M87 347V1161" stroke="#6FA8DC" stroke-width="3"/>
  <g opacity="1">
    <rect x="137" y="324" width="888" height="120" rx="10" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="62" y="351" width="50" height="50" rx="8" fill="#232830" stroke="#404754" stroke-width="1.5"/>
    <text x="87" y="384" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">01</text>
    <text x="165" y="375" fill="#E5E9F0" font-family="Sofia Sans" font-size="32" font-weight="700" >Start from real conversations</text>
    <text x="165" y="415" fill="#A0A8B5" font-family="Sofia Sans" font-size="24" font-weight="400" >Pull topics from sales calls and strategy work.</text>
  </g><g opacity="1">
    <rect x="137" y="465" width="888" height="120" rx="10" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="62" y="492" width="50" height="50" rx="8" fill="#232830" stroke="#404754" stroke-width="1.5"/>
    <text x="87" y="525" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">02</text>
    <text x="165" y="516" fill="#E5E9F0" font-family="Sofia Sans" font-size="32" font-weight="700" >Publish the belief to change</text>
    <text x="165" y="556" fill="#A0A8B5" font-family="Sofia Sans" font-size="24" font-weight="400" >Challenge what buyers must stop believing. Bring proof.</text>
  </g><g opacity="1">
    <rect x="137" y="606" width="888" height="120" rx="10" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="62" y="633" width="50" height="50" rx="8" fill="#232830" stroke="#404754" stroke-width="1.5"/>
    <text x="87" y="666" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">03</text>
    <text x="165" y="657" fill="#E5E9F0" font-family="Sofia Sans" font-size="32" font-weight="700" >Write in the founder’s voice</text>
    <text x="165" y="697" fill="#A0A8B5" font-family="Sofia Sans" font-size="24" font-weight="400" >Give the hook, argument, proof, and visual separate jobs.</text>
  </g><g opacity="1">
    <rect x="137" y="802" width="888" height="120" rx="10" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="62" y="829" width="50" height="50" rx="8" fill="#232830" stroke="#404754" stroke-width="1.5"/>
    <text x="87" y="862" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">04</text>
    <text x="165" y="853" fill="#E5E9F0" font-family="Sofia Sans" font-size="32" font-weight="700" >Capture everyone who reacts</text>
    <text x="165" y="893" fill="#A0A8B5" font-family="Sofia Sans" font-size="24" font-weight="400" >Save likes and comments. Check role, company, and ICP fit.</text>
  </g><g opacity="1">
    <rect x="137" y="943" width="888" height="120" rx="10" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="62" y="970" width="50" height="50" rx="8" fill="#232830" stroke="#404754" stroke-width="1.5"/>
    <text x="87" y="1003" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">05</text>
    <text x="165" y="994" fill="#E5E9F0" font-family="Sofia Sans" font-size="32" font-weight="700" >Reach out with context</text>
    <text x="165" y="1034" fill="#A0A8B5" font-family="Sofia Sans" font-size="24" font-weight="400" >Message the people who fit. Mention their engagement.</text>
  </g><g opacity="1">
    <rect x="137" y="1084" width="888" height="120" rx="10" fill="#181C23" stroke="#404754" stroke-width="1.5"/>
    <rect x="62" y="1111" width="50" height="50" rx="8" fill="#232830" stroke="#404754" stroke-width="1.5"/>
    <text x="87" y="1144" fill="#E5E9F0" font-family="JetBrains Mono" font-size="21" font-weight="600" text-anchor="middle">06</text>
    <text x="165" y="1135" fill="#E5E9F0" font-family="Sofia Sans" font-size="32" font-weight="700" >Connect the activity to CRM</text>
    <text x="165" y="1175" fill="#A0A8B5" font-family="Sofia Sans" font-size="24" font-weight="400" >Tag content-sourced leads. Report deals, not impressions.</text>
  </g>
