  <text x="556" y="1174" fill="#A0A8B5" font-family="Sofia Sans" font-size="20" font-weight="400" >Source + enrich</text><circle cx="824" cy="1092" r="17" fill="#232830" stroke="#6FA8DC" stroke-width="2"/>
