  <text x="56" y="75" fill="#E11E48" font-family="JetBrains Mono" font-size="20" font-weight="600" letter-spacing="1">THE REP-READY QUEUE</text>
  <text x="56" y="163" fill="#E5E9F0" font-family="Sofia Sans" font-size="77" font-weight="700" >Give reps a</text>
  <text x="56" y="248" fill="#E11E48" font-family="Sofia Sans" font-size="79" font-weight="700" font-style="italic">reason to act.</text>
  <text x="56" y="294" fill="#A0A8B5" font-family="Sofia Sans" font-size="25" font-weight="400" >What one qualified account should arrive with.</text>
