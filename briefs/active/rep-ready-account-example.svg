  <text x="263" y="889" fill="#E5E9F0" font-family="Sofia Sans" font-size="27" font-weight="600" >Ask how qualified accounts reach new reps</text>
  <text x="263" y="917" fill="#A0A8B5" font-family="Sofia Sans" font-size="20" font-weight="400" >Open with the hiring signal</text>
