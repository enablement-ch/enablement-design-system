  <text x="263" y="409" fill="#E5E9F0" font-family="Sofia Sans" font-size="33" font-weight="700" >B2B software account</text>
  <path d="M263 431H817" stroke="#404754" stroke-opacity=".65"/>
  <text x="263" y="459" fill="#E11E48" font-family="JetBrains Mono" font-size="17" font-weight="600" letter-spacing="1">FIT</text>
  <text x="263" y="493" fill="#E5E9F0" font-family="Sofia Sans" font-size="27" font-weight="600" >B2B software · 50–200 employees</text>
  <text x="263" y="521" fill="#A0A8B5" font-family="Sofia Sans" font-size="20" font-weight="400" >Sales team in target market</text><path d="M263 530H817" stroke="#404754" stroke-opacity=".65"/>
  <text x="263" y="558" fill="#E11E48" font-family="JetBrains Mono" font-size="17" font-weight="600" letter-spacing="1">SIGNAL</text>
  <text x="263" y="592" fill="#E5E9F0" font-family="Sofia Sans" font-size="27" font-weight="600" >Two SDR roles posted this week</text>
  <text x="263" y="620" fill="#A0A8B5" font-family="Sofia Sans" font-size="20" font-weight="400" >Source: public job listings</text><path d="M263 629H817" stroke="#404754" stroke-opacity=".65"/>
  <text x="263" y="657" fill="#E11E48" font-family="JetBrains Mono" font-size="17" font-weight="600" letter-spacing="1">CONTACT</text>
  <text x="263" y="691" fill="#E5E9F0" font-family="Sofia Sans" font-size="27" font-weight="600" >VP Sales</text>
  <text x="263" y="719" fill="#A0A8B5" font-family="Sofia Sans" font-size="20" font-weight="400" >Owns the SDR team</text><path d="M263 728H817" stroke="#404754" stroke-opacity=".65"/>
  <text x="263" y="756" fill="#E11E48" font-family="JetBrains Mono" font-size="17" font-weight="600" letter-spacing="1">CONTEXT</text>
  <text x="263" y="790" fill="#E5E9F0" font-family="Sofia Sans" font-size="27" font-weight="600" >Fact: hiring more outbound capacity</text>
  <text x="263" y="818" fill="#A0A8B5" font-family="Sofia Sans" font-size="20" font-weight="400" >Question: how will new reps get accounts?</text><path d="M263 827H817" stroke="#404754" stroke-opacity=".65"/>
