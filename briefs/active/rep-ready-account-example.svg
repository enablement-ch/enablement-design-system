  <text x="55" y="659" fill="#6FA8DC" font-family="JetBrains Mono" font-size="16" font-weight="600" letter-spacing=".5">NAME THE OWNER</text>
  <text x="55" y="689" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >No extra hunt in</text><text x="55" y="713" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >Sales Navigator.</text><path d="M848 779H845" stroke="#6FA8DC" stroke-width="2"/>
  <circle cx="845" cy="779" r="4" fill="#6FA8DC"/>
  <text x="870" y="758" fill="#6FA8DC" font-family="JetBrains Mono" font-size="16" font-weight="600" letter-spacing=".5">MARK THE INFERENCE</text>
  <text x="870" y="788" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >Ask about the gap.</text><text x="870" y="812" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >Do not assume it.</text><path d="M212 878H235" stroke="#6FA8DC" stroke-width="2"/>
  <circle cx="235" cy="878" r="4" fill="#6FA8DC"/>
  <text x="55" y="857" fill="#6FA8DC" font-family="JetBrains Mono" font-size="16" font-weight="600" letter-spacing=".5">SUGGEST A MOVE</text>
  <text x="55" y="887" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >Turn the record</text><text x="55" y="911" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >into outreach.</text>
