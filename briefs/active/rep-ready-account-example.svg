  <text x="870" y="590" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >Give the rep a</text><text x="870" y="614" fill="#A0A8B5" font-family="Sofia Sans" font-size="18" font-weight="400" >reason to act now.</text><path d="M212 680H235" stroke="#6FA8DC" stroke-width="2"/>
